<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CryptoScope — Live Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f7;--panel:#fff;--border:#dde1ea;--accent:#0fa968;--red:#e53e51;--yellow:#d4940a;--blue:#2563eb;--orange:#e8740c;--purple:#7c3aed;--text:#1a1f2e;--dim:#5c6478;--muted:#9aa0b0;--sh:0 1px 3px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px}
.app{max-width:1560px;margin:0 auto;padding:20px 24px 60px}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--panel);border:1px solid var(--border);border-radius:14px;margin-bottom:24px;box-shadow:var(--sh)}
.logo{display:flex;align-items:center;gap:14px}
.logo i{width:42px;height:42px;background:linear-gradient(135deg,var(--accent),#2563eb);border-radius:10px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:18px;font-weight:700;color:#fff}
.logo b{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700}
.logo b span{color:var(--accent)}
.hdr-r{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.btn{background:var(--accent);border:none;color:#fff;padding:8px 18px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:.2s;text-transform:uppercase}
.btn:hover{background:#0c8f58;transform:translateY(-1px)}
.btn:disabled{background:#aaa;cursor:not-allowed;transform:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.sc{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;box-shadow:var(--sh);opacity:0;animation:fu .5s ease forwards}
.sc:nth-child(1){animation-delay:.1s}.sc:nth-child(2){animation-delay:.15s}.sc:nth-child(3){animation-delay:.2s}.sc:nth-child(4){animation-delay:.25s}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sc:nth-child(1)::before{background:var(--accent)}.sc:nth-child(2)::before{background:var(--blue)}.sc:nth-child(3)::before{background:var(--yellow)}.sc:nth-child(4)::before{background:var(--purple)}
.sl{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.sv{font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700}
.ss{font-size:12px;margin-top:4px}.up{color:var(--accent)}.dn{color:var(--red)}
.st{display:flex;align-items:center;gap:10px;margin:30px 0 14px;font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700}
.si{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.sb{font-size:10px;font-family:'JetBrains Mono',monospace;padding:3px 9px;border-radius:5px;font-weight:600}
.tw{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--sh);opacity:0;animation:fu .6s ease forwards;animation-delay:.3s}
.th{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border);background:#fafbfd}
.sb2{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:8px 13px;color:var(--text);font-family:inherit;font-size:12px;width:210px;outline:none}
.sb2:focus{border-color:var(--accent)}
table{width:100%;border-collapse:collapse}
thead th{padding:12px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);text-align:left;border-bottom:2px solid var(--border);background:#f6f7fb;position:sticky;top:0;cursor:pointer;white-space:nowrap}
thead th:hover{color:var(--accent)}
.r{text-align:right}.c{text-align:center}
tbody tr{border-bottom:1px solid #eef0f5;transition:.15s}
tbody tr:hover{background:#eef1f8}
td{padding:12px 14px;font-size:13px;white-space:nowrap}
.rk{color:var(--muted);font-weight:600}
.ai{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden;background:#eef0f5;color:var(--dim)}
.ai img{width:100%;height:100%;border-radius:50%}
.an{font-weight:600;font-size:14px}.ap{font-size:10px;color:var(--dim)}
.pr{font-weight:600}
.ch{font-weight:700;padding:3px 9px;border-radius:5px;font-size:12px;display:inline-block}
.ch.up{color:#0a8f56;background:#e6f9f0}.ch.dn{color:#c43040;background:#fde8eb}
.ts{max-height:600px;overflow-y:auto}
.xg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.xc{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:14px;transition:.2s;box-shadow:var(--sh)}
.xc:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.xr{width:34px;height:34px;border-radius:9px;background:#eef0f5;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--dim);border:1px solid var(--border);overflow:hidden}
.xr img{width:100%;height:100%;border-radius:9px}
.xn{font-weight:600;font-size:14px}
.xv{text-align:right;min-width:110px}
.xvt{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700}
.xvl{font-size:10px;color:var(--dim)}
.xtp{font-size:10px;color:var(--dim);margin-left:6px;font-weight:600}
.xinfo{font-size:11px;color:var(--muted);margin-top:2px}
.il{display:flex;flex-direction:column;gap:10px}
.ir{display:grid;grid-template-columns:80px 1fr 120px 110px 100px;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 20px;transition:.2s;cursor:pointer;box-shadow:var(--sh);position:relative}
.ir:hover{box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px);border-color:var(--red)}
.ir .ch3{position:absolute;right:14px;bottom:6px;font-size:9px;color:var(--muted);opacity:0;transition:.2s}
.ir:hover .ch3{opacity:1}
.sev{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;padding:4px 10px;border-radius:5px;text-align:center}
.sev.critical{background:#fde8eb;color:var(--red)}.sev.high{background:#fff3e0;color:var(--orange)}.sev.medium{background:#fef7e6;color:var(--yellow)}.sev.low{background:#eff4ff;color:var(--blue)}
.ii h5{font-size:14px;font-weight:600;margin-bottom:3px}.ii p{font-size:12px;color:var(--dim)}
.il2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--red);text-align:right}
.ic{font-size:12px;color:var(--dim);text-align:center}
.it{font-size:12px;color:var(--muted);text-align:right}
.loading{text-align:center;padding:40px;color:var(--dim);font-size:13px}
.loading span{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin:0 4px;animation:bounce .6s infinite alternate}
.loading span:nth-child(2){animation-delay:.2s}.loading span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-8px);opacity:.4}}
.err{padding:20px;color:var(--red);text-align:center;font-size:13px;background:#fde8eb;border-radius:10px;margin:10px 0}
.mo{position:fixed;inset:0;z-index:10000;background:rgba(15,18,30,.45);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;opacity:0;transition:.3s}
.mo.v{display:flex;opacity:1}
.mp{background:var(--panel);border:1px solid var(--border);border-radius:18px;width:90%;max-width:780px;max-height:85vh;overflow-y:auto;transform:translateY(20px) scale(.97);transition:transform .35s cubic-bezier(.16,1,.3,1);box-shadow:0 30px 90px rgba(0,0,0,.18)}
.mo.v .mp{transform:translateY(0) scale(1)}
.mh{padding:24px 28px 18px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.mt{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;line-height:1.35;margin-top:8px}
.mc{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--bg);color:var(--dim);font-size:18px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mc:hover{border-color:var(--red);color:var(--red);background:#fde8eb}
.mb{padding:24px 28px 28px}
.ms{margin-bottom:22px}.ms:last-child{margin-bottom:0}
.mst{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:7px}
.mst::before{content:'';width:3px;height:13px;background:var(--accent);border-radius:2px}
.mst.red{color:var(--red)}.mst.red::before{background:var(--red)}
.mst.org{color:var(--orange)}.mst.org::before{background:var(--orange)}
.mst.blu{color:var(--blue)}.mst.blu::before{background:var(--blue)}
.mtxt{font-size:14px;line-height:1.85;color:var(--text)}
.mg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.mi{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:14px}
.mi .lb{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.mi .vl{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700}
.tml{position:relative;padding-left:22px}
.tml::before{content:'';position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--border);border-radius:1px}
.ti{position:relative;margin-bottom:14px}.ti:last-child{margin-bottom:0}
.ti::before{content:'';position:absolute;left:-19px;top:6px;width:9px;height:9px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 2px #0fa96818}
.ti.rd::before{background:var(--red);box-shadow:0 0 0 2px #e53e5115}
.ti.gr::before{background:var(--accent)}
.tl-tm{font-size:10px;color:var(--muted);margin-bottom:2px}
.tl-tx{font-size:13px;line-height:1.55}
.mtags{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.mtag{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:12px;font-weight:500}
.lb-tbl{width:100%;border-collapse:collapse;margin-top:6px}
.lb-tbl th{text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);padding:7px 11px;border-bottom:2px solid var(--border);background:#f6f7fb}
.lb-tbl td{padding:9px 11px;font-size:12px;border-bottom:1px solid #eef0f5}
.la{color:var(--red);font-weight:700;font-family:'Space Grotesk',sans-serif}
.cl{list-style:none;padding:0}.cl li{padding:7px 0 7px 22px;font-size:13px;line-height:1.6;position:relative;border-bottom:1px solid #eef0f5}.cl li:last-child{border-bottom:none}.cl li::before{content:'→';position:absolute;left:0;color:var(--red);font-weight:700}
.rl{list-style:none;padding:0}.rl li{padding:7px 0 7px 22px;font-size:13px;line-height:1.6;position:relative;border-bottom:1px solid #eef0f5}.rl li:last-child{border-bottom:none}.rl li::before{content:'✓';position:absolute;left:0;color:var(--accent);font-weight:700}
.stb{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:5px;text-transform:uppercase;letter-spacing:.5px}
.stb.ongoing{background:#fde8eb;color:var(--red)}.stb.mitigated{background:#fef7e6;color:var(--yellow)}.stb.resolved{background:#e6f9f0;color:var(--accent)}
.src-tag{font-size:10px;color:var(--muted);background:var(--bg);padding:3px 8px;border-radius:4px;border:1px solid var(--border)}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:#cdd3e0;border-radius:3px}
@media(max-width:1200px){.stats{grid-template-columns:repeat(2,1fr)}.xg{grid-template-columns:1fr}.ir{grid-template-columns:70px 1fr 100px 80px}.ic{display:none}.mg{grid-template-columns:repeat(2,1fr)}}
@media(max-width:768px){.app{padding:12px 14px 40px}.stats{grid-template-columns:1fr}.hdr{flex-direction:column;gap:12px;align-items:flex-start}.ir{grid-template-columns:1fr;gap:8px}.il2,.it{text-align:left}.mp{width:96%}.mg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<div class="hdr">
<div class="logo"><i>CS</i><b>Crypto<span>Scope</span></b></div>
<div class="hdr-r"><span class="src-tag" id="srcTag">📡 CoinCap API</span><div style="display:flex;align-items:center;gap:8px"><div class="dot"></div><span style="font-size:12px;color:var(--dim)" id="clock">--:--:--</span></div><button class="btn" id="rBtn" onclick="loadAll()">⟳ Refresh</button></div>
</div>

<div class="stats">
<div class="sc"><div class="sl">Total Market Cap</div><div class="sv" id="s1">...</div><div class="ss" id="s1s">loading</div></div>
<div class="sc"><div class="sl">24h Volume</div><div class="sv" id="s2">...</div><div class="ss" id="s2s">loading</div></div>
<div class="sc"><div class="sl">BTC Dominance</div><div class="sv" id="s3">...</div><div class="ss" id="s3s">loading</div></div>
<div class="sc"><div class="sl">Active Exchanges</div><div class="sv" id="s4">...</div><div class="ss" id="s4s">loading</div></div>
</div>

<div class="st"><div class="si" style="background:#e6f9f0;color:var(--accent)">📊</div>Top 30 Assets<span class="sb" style="background:#e6f9f0;color:var(--accent)">LIVE</span></div>
<div class="tw"><div class="th"><div style="font-size:14px;font-weight:600">💰 Market Data</div><input class="sb2" placeholder="Search token..." oninput="ft(this.value)"></div><div class="ts" id="coinWrap"><div class="loading"><span></span><span></span><span></span> Loading live data...</div></div></div>

<div class="st"><div class="si" style="background:#eff4ff;color:var(--blue)">🏦</div>Top 30 Exchanges<span class="sb" style="background:#eff4ff;color:var(--blue)">LIVE</span></div>
<div id="exWrap"><div class="loading"><span></span><span></span><span></span> Loading exchanges...</div></div>
<div class="xg" id="xg"></div>

<div class="st"><div class="si" style="background:#fef7e6;color:var(--yellow)">🛡️</div>Web3 Wallet Security Incidents<span class="sb" style="background:#fef7e6;color:var(--yellow)">REAL DATA</span></div>
<div class="il" id="il"></div>
</div>

<div class="mo" id="m2" onclick="cm(event,'m2')"><div class="mp" onclick="event.stopPropagation()"><div class="mh"><div><span class="sev" id="m2sv"></span><div class="mt" id="m2tt"></div></div><button class="mc" onclick="cm(null,'m2')">✕</button></div><div class="mb" id="m2b"></div></div></div>

<script>
function ck(){document.getElementById('clock').textContent=new Date().toUTCString().slice(17,25)+' UTC'}
setInterval(ck,1000);ck();

function fmt(n){if(!n&&n!==0)return'N/A';n=Number(n);if(n>=1e12)return'$'+(n/1e12).toFixed(2)+'T';if(n>=1e9)return'$'+(n/1e9).toFixed(2)+'B';if(n>=1e6)return'$'+(n/1e6).toFixed(2)+'M';if(n>=1e3)return'$'+(n/1e3).toFixed(1)+'K';return'$'+n.toFixed(2)}
function fmtP(n){if(!n&&n!==0)return'N/A';n=Number(n);return(n>=0?'+':'')+n.toFixed(2)+'%'}
function fmtPr(n){if(!n&&n!==0)return'N/A';n=Number(n);if(n>=1)return'$'+n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});if(n>=0.01)return'$'+n.toFixed(4);if(n>=0.0001)return'$'+n.toFixed(6);return'$'+n.toFixed(8)}

var coinCache=[];

// ── CoinCap API: Top 30 ──
async function loadCoins(){
  try{
    var r=await fetch('https://api.coincap.io/v2/assets?limit=30');
    if(!r.ok)throw new Error('HTTP '+r.status);
    var j=await r.json();
    coinCache=j.data;
    renderCoins(j.data);
  }catch(e){
    console.error('Coin API error:',e);
    document.getElementById('coinWrap').innerHTML='<div class=err>Failed to load coin data: '+e.message+'<br>CoinCap may be rate-limited. Try again in 30 seconds.</div>';
  }
}

function renderCoins(data){
  var b=document.getElementById('coinWrap');
  var html='<table><thead><tr><th>#</th><th>Asset</th><th class=r>Price</th><th class=r>24h%</th><th class=r>Supply</th><th class=r>Vol 24h</th><th class=r>Market Cap</th></tr></thead><tbody>';
  data.forEach(function(x){
    var c24=Number(x.changePercent24Hr)||0;
    var c=c24>=0?'up':'dn';
    var sym=x.symbol.toLowerCase();
    var icon='https://assets.coincap.io/assets/icons/'+sym+'@2x.png';
    var sup=x.supply?Number(x.supply).toLocaleString('en',{maximumFractionDigits:0}):'N/A';
    html+='<tr><td class=rk>'+x.rank+'</td><td><div style="display:flex;align-items:center;gap:10px"><div class=ai><img src="'+icon+'" onerror="this.style.display=\'none\'" alt=""></div><div style="display:flex;flex-direction:column"><span class=an>'+x.name+'</span><span class=ap>'+x.symbol+'/USDT</span></div></div></td><td class="r pr">'+fmtPr(x.priceUsd)+'</td><td class=r><span class="ch '+c+'">'+fmtP(c24)+'</span></td><td class="r" style="color:var(--dim);font-size:12px">'+sup+'</td><td class="r" style="color:var(--dim)">'+fmt(x.volumeUsd24Hr)+'</td><td class="r" style="font-weight:600">'+fmt(x.marketCapUsd)+'</td></tr>';
  });
  html+='</tbody></table>';
  b.innerHTML=html;
}

// ── CoinCap API: Global ──
async function loadGlobal(){
  try{
    var r=await fetch('https://api.coincap.io/v2/assets?limit=30');
    if(!r.ok)throw new Error('HTTP '+r.status);
    var j=await r.json();
    var data=j.data;
    var totalMcap=0,totalVol=0,btcMcap=0;
    data.forEach(function(x){
      totalMcap+=Number(x.marketCapUsd)||0;
      totalVol+=Number(x.volumeUsd24Hr)||0;
      if(x.symbol==='BTC')btcMcap=Number(x.marketCapUsd)||0;
    });
    document.getElementById('s1').textContent=fmt(totalMcap);
    document.getElementById('s1s').innerHTML='Top 30 Combined';
    document.getElementById('s1s').className='ss up';
    document.getElementById('s2').textContent=fmt(totalVol);
    document.getElementById('s2s').innerHTML='24h Trading Volume';
    document.getElementById('s2s').className='ss';
    var dom=totalMcap>0?(btcMcap/totalMcap*100).toFixed(1):'N/A';
    document.getElementById('s3').textContent=dom+'%';
    document.getElementById('s3s').innerHTML='of Top 30';
    document.getElementById('s3s').className='ss up';
  }catch(e){
    console.error('Global error:',e);
  }
}

// ── CoinCap API: Exchanges ──
async function loadExchanges(){
  try{
    var r=await fetch('https://api.coincap.io/v2/exchanges?limit=30');
    if(!r.ok)throw new Error('HTTP '+r.status);
    var j=await r.json();
    document.getElementById('exWrap').innerHTML='';
    var g=document.getElementById('xg');
    g.innerHTML='';
    document.getElementById('s4').textContent=j.data.length;
    document.getElementById('s4s').innerHTML='Tracked by CoinCap';
    document.getElementById('s4s').className='ss';
    j.data.forEach(function(x,i){
      var c=document.createElement('div');c.className='xc';
      var volBtc=Number(x.volumeUsd24Hr)||0;
      var sym=x.name.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,4);
      c.innerHTML='<div class=xr>'+(i+1)+'</div><div><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span class=xn>'+x.name+'</span><span class=xtp style="color:var(--blue)">[CEX]</span></div><div class=xinfo>Pairs: '+(x.tradingPairs||'N/A')+' | Socket: '+(x.socket?'Yes':'No')+'</div></div><div class=xv><div class=xvt>'+fmt(volBtc)+'</div><div class=xvl>24h Volume (USD)</div></div>';
      g.appendChild(c);
    });
  }catch(e){
    console.error('Exchange API error:',e);
    document.getElementById('exWrap').innerHTML='<div class=err>Failed to load exchange data: '+e.message+'</div>';
  }
}

// ── Security Incidents ──

function renderIn(){
  var l=document.getElementById('il');l.innerHTML='';
  IN.forEach(function(inc,i){
    var r=document.createElement('div');r.className='ir';r.onclick=function(){om2(i)};
    r.innerHTML='<span class="sev '+inc.sv+'">'+inc.sv+'</span><div class=ii><h5>'+inc.ti+'</h5><p>'+inc.ds+'</p></div><div class=il2>'+inc.ls+'</div><div class=ic>'+inc.ch+'</div><div class=it>'+inc.tm+'</div><span class=ch3>▸ Details</span>';
    l.appendChild(r);
  });
}

function ft(q){q=q.toLowerCase();document.querySelectorAll('#coinWrap tr').forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>-1?'':'none'})}

async function loadAll(){
  var btn=document.getElementById('rBtn');btn.disabled=true;btn.textContent='⟳ Loading...';
  document.getElementById('srcTag').textContent='📡 Fetching...';
  try{
    await Promise.all([loadCoins(),loadGlobal(),loadExchanges()]);
    document.getElementById('srcTag').textContent='📡 CoinCap | Updated '+new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('srcTag').textContent='⚠️ Partial load';
  }
  btn.disabled=false;btn.textContent='⟳ Refresh';
}
